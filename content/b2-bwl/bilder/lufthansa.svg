<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" width="400" height="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="12" y="20" font-size="12.5" font-weight="700" fill="#234b40">Lufthansa AG · dualistisches System (Two-Tier)</text><rect x="110.0" y="34.0" width="180.0" height="81.1" rx="7" fill="#f4f1e6"/><text x="200.0" y="51.5" font-size="11" text-anchor="middle" fill="#1f2a26">Hauptversammlung</text><text x="200.0" y="64.9" font-size="11" text-anchor="middle" fill="#1f2a26">(Eigentümer)</text><text x="200.0" y="78.3" font-size="11" text-anchor="middle" fill="#1f2a26">Entlastung,</text><text x="200.0" y="91.7" font-size="11" text-anchor="middle" fill="#1f2a26">Gewinnverwendung; je</text><text x="200.0" y="105.1" font-size="11" text-anchor="middle" fill="#1f2a26">Stückaktie eine Stimme</text><rect x="110.0" y="141.1" width="180.0" height="54.3" rx="7" fill="#dfeaf6"/><text x="200.0" y="158.5" font-size="11" text-anchor="middle" fill="#1f2a26">Aufsichtsrat (Überwachung)</text><text x="200.0" y="172.0" font-size="11" text-anchor="middle" fill="#1f2a26">20 Mitglieder, paritätisch</text><text x="200.0" y="185.4" font-size="11" text-anchor="middle" fill="#1f2a26">10 / 10</text><rect x="110.0" y="221.4" width="180.0" height="54.3" rx="7" fill="#e3efe8"/><text x="200.0" y="238.8" font-size="11" text-anchor="middle" fill="#1f2a26">Vorstand (Leitung)</text><text x="200.0" y="252.2" font-size="11" text-anchor="middle" fill="#1f2a26">CEO; berichtet dem</text><text x="200.0" y="265.6" font-size="11" text-anchor="middle" fill="#1f2a26">Aufsichtsrat</text><line x1="200.0" y1="117.1" x2="200.0" y2="139.1" stroke="#234b40" stroke-width="1.6"/><path d="M200.0,139.1 L197.0,132.8 L203.0,132.8 Z" fill="#234b40"/><text x="206.0" y="132.1" font-size="9.5" text-anchor="start" fill="#5d6b65">wählt Anteilseigner-Vertreter</text><line x1="200.0" y1="197.4" x2="200.0" y2="219.4" stroke="#234b40" stroke-width="1.6"/><path d="M200.0,219.4 L197.0,213.1 L203.0,213.1 Z" fill="#234b40"/><text x="206.0" y="212.4" font-size="9.5" text-anchor="start" fill="#5d6b65">bestellt, überwacht, berät</text><text x="200.0" y="293.9" font-size="11" text-anchor="middle" fill="#5d6b65" font-style="italic">Strikte Trennung von Leitung und Überwachung.</text><text x="392" y="315" font-size="9" text-anchor="end" fill="#5d6b65">nachgezeichnet für Lernraum · Original: Vahs/Schäfer-Kunz</text></svg>